name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  dataset-reproducible:
    # Garante que packages/data-firered/data é exatamente o que o pipeline gera do decomp fixado.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bash tools/data-pipeline/fetch-decomp.sh .decomp
      - run: node tools/data-pipeline/build.mjs .decomp
      - run: git diff --exit-code packages/data-firered/data
